<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Willowbend</title>
<meta name="theme-color" content="#9fdcf8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 34 32 12l24 22z' fill='%23e8604c' stroke='%234b3140' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='14' y='32' width='36' height='22' rx='3' fill='%23fff0d2' stroke='%234b3140' stroke-width='4'/%3E%3Crect x='27' y='40' width='10' height='14' fill='%234f9bd6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4b3140; --cream: #fff9ea; --coral: #ff8f66; --gold: #ffe59a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fdcf8; font-family: 'Fredoka', sans-serif; color: var(--ink);
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- splash ---------- */
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; transition: opacity 0.9s ease; cursor: pointer; z-index: 5; }
  #splash::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 62%, rgba(70,40,60,0.2) 100%); }
  #splash.gone { opacity: 0; pointer-events: none; }
  .title { position: relative; margin: 3.2vh 0 0; font: 800 min(16.5vh, 15vw)/1 'Baloo 2', sans-serif; white-space: nowrap; z-index: 1; }
  .title .layer { display: block; }
  .title .layer span { display: inline-block; }
  .title .back { color: var(--ink); -webkit-text-stroke: min(2.6vh, 2.4vw) var(--ink); filter: drop-shadow(0 1vh 0 var(--ink)) drop-shadow(0 2vh 1.4vh rgba(60, 30, 50, 0.35)); }
  .title .front { position: absolute; left: 0; top: 0; }
  .title .front span { background: linear-gradient(#fffdf2 38%, #ffe59a 78%, #ffc96b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ribbon { z-index: 1; margin-top: -1.2vh; padding: 0.7vh 3.4vh 0.9vh; background: var(--coral); color: var(--cream); font-weight: 600; font-size: min(3.3vh, 4vw); letter-spacing: 0.04em; white-space: nowrap;
    border: 0.55vh solid var(--ink); border-radius: 99vh; transform: rotate(-1.5deg); box-shadow: 0 0.7vh 0 var(--ink); }
  .ribbon i { font-style: normal; color: var(--gold); margin: 0 1.2vh; }
  .start { z-index: 1; position: absolute; bottom: calc(3.6vh + env(safe-area-inset-bottom)); padding: 0.9vh 3.6vh 1.1vh; background: var(--cream); font-weight: 600; font-size: min(3vh, 4.4vw); white-space: nowrap;
    border: 0.5vh solid var(--ink); border-radius: 99vh; box-shadow: 0 0.6vh 0 var(--ink); animation: pulse 1.6s ease-in-out infinite; }
  .start b { color: #ff7a59; margin-right: 1vh; }
  @keyframes pulse { 50% { transform: translateY(-0.5vh); } }
  #loading { z-index: 1; position: absolute; bottom: calc(3.6vh + env(safe-area-inset-bottom)); font-weight: 600; font-size: 2.6vh; color: var(--cream); text-shadow: 0 0.25vh 0 var(--ink); }
  #splash.loading .start { display: none; }
  #splash:not(.loading) #loading { display: none; }

  /* ---------- hud ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.8s ease 0.4s; z-index: 3; }
  #hud.on { opacity: 1; }
  .pill { background: var(--cream); border: 3px solid var(--ink); border-radius: 99px; box-shadow: 0 4px 0 var(--ink); font-weight: 600; }
  #zone { position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -140%); padding: 6px 22px 8px; font-size: 22px; white-space: nowrap;
    transition: transform 0.45s cubic-bezier(.2,1.4,.4,1); }
  #zone.show { transform: translate(-50%, 0); }
  #zone small { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #b06a4a; text-align: center; margin-bottom: -2px; }
  #help { position: absolute; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); padding: 6px 14px 7px; font-size: 14px; font-weight: 500; }
  #objective { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 14px; padding: 7px 13px; max-width: min(245px, 38vw); font-size: 15px; }
  body.touch #objective { top: auto; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: min(240px, 55vw); }
  #help b { display: inline-block; min-width: 1.2em; padding: 0 4px; margin: 0 2px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; text-align: center; font-weight: 700; font-size: 12px; }
  #prompt { position: absolute; left: 0; top: 0; padding: 4px 12px 5px; font-size: 15px; white-space: nowrap; transform: translate(-50%, -100%); display: none; }
  #prompt b { color: #ff7a59; }
  #bubble { position: absolute; left: 0; top: 0; max-width: min(320px, 78vw); padding: 10px 16px 12px; font-size: 17px; font-weight: 500; line-height: 1.3; display: none;
    background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); transform: translate(-50%, calc(-100% - 14px)); }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -13px; width: 18px; height: 18px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  #bubble .who { display: block; font-weight: 700; font-size: 13px; color: #ff7a59; letter-spacing: 0.06em; text-transform: uppercase; }

  /* touch */
  #stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255, 249, 234, 0.35); border: 3px solid rgba(75, 49, 64, 0.5); display: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  #talk { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(28px + env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%; pointer-events: auto;
    background: var(--coral); color: var(--cream); font: 700 17px Fredoka, sans-serif; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); display: none; }
  body.touch #help { display: none; }
  body.touch #talk.near { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="splash" class="loading">
  <h1 class="title" id="title"></h1>
  <div class="ribbon">Grow a village <i>&#10022;</i> Wander the wild</div>
  <div class="start"><b>&#9654;</b>Press any key to start</div>
  <div id="loading">Planting the village&hellip;</div>
</div>
<div id="hud">
  <div id="zone" class="pill"><small>now entering</small><span></span></div>
  <div id="help" class="pill"><b>W</b><b>A</b><b>S</b><b>D</b> walk &nbsp; <b>Shift</b> run &nbsp; <b>Q</b><b>E</b> or drag to turn &nbsp; <b>&minus;</b><b>+</b> or wheel to zoom &nbsp; <b>Space</b> interact</div>
  <div id="objective" class="pill" role="status" hidden></div>
  <div id="prompt" class="pill"></div>
  <div id="bubble"><span class="who"></span><span class="say"></span></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="talk" type="button">Talk</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
